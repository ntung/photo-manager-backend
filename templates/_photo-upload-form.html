<form method="post" enctype="multipart/form-data" id="upload-form">
    <div class="mb-3">
        <div id="drop-area">
            <b><label for="photo-upload"
                      class="form-label">Browse OR Drag and Drop a photo here</label></b>
            <input type="file" id="photo-upload" name="photo-upload" multiple
                   class="form-control" accept="image/png,image/jpeg,image/jpg"
                   title="Click here to add photos"/>
        </div>
        <br/>
        <strong><label for="photo-url" class="form-label">Image/Photo URL</label></strong><br/>
        <input id="photo-url" name="photo-url" type="text" placeholder="Image/Photo URL"
               class="form-control"/>

    </div>

    <div class="mb-3">
        <strong><label for="photo-title" class="form-label">Title</label></strong><br/>
        <input id="photo-title" name="title" type="text" placeholder="Title of photo"
               class="form-control"/>
    </div>
    <div class="mb-3">
        <strong><label for="photo-description" class="form-label">Description</label></strong><br/>
        <textarea id="photo-description" name="description" type="textarea"
                  placeholder="Provide a description"
                  class="form-control"></textarea>
    </div>
    <div class="mb-3">
        <strong><label for="photo-courtesy" class="form-label">Credit/Courtesy</label></strong><br/>
        <input id="photo-courtesy" name="courtesy" type="text" placeholder="Credit or Courtesy"
               class="form-control photo-courtesy"/>
    </div>
    <!--<div class="mb-3">
        <strong><label for="photo-hashtags" class="form-label">Hashtags</label></strong><br/>
        <input id="photo-hashtags" name="hashtags" type="text" placeholder="Hashtags"
               class="form-control"/>
    </div>
    <div class="mb-3">
        <strong><label for="photo-keywords" class="form-label">Keywords</label></strong><br/>
        <input id="photo-keywords" name="keywords" type="text" placeholder="Keywords"
               class="form-control"/>
    </div>-->
    <div class="mb-3" id="action-button">
        <button class="btn btn-primary btn-photo-upload">Upload</button>
    </div>
</form>
<script>
    let fileList;
    let contentType = 'application/json; charset=utf-8';
    // Listen for the moment the file selection changes (i.e., the user selects files)
    $('#photo-upload').on('change', function(event) {
        event.preventDefault();
        // 'this' inside the handler refers to the native DOM element
        const fileInput = this;

        // This is where you access the files property
        fileList = fileInput.files;

        if (fileList && fileList.length > 0) {
            console.log("Files are now defined and ready:", fileList);
            // Now you can start reading or uploading them
        } else {
            // User may have opened the dialog and clicked cancel
            console.log("No files selected.");
        }
    });

    function extractData(event) {
        event.preventDefault();
        
        const photoUrl = $("#photo-url").val();
        const title = $("#photo-title").val();
        const description = $("#photo-description").val();
        const courtesy = $("#photo-courtesy").val();

        const metaData = {
            'photo-url': photoUrl,
            'title': title,
            'description': description,
            'courtesy': courtesy
        }
        const strMetaData = JSON.stringify(metaData);
        const formData = new FormData();
        formData.append('metadata', strMetaData);
        if (fileList !== undefined) {
            const photoUpload = fileList[0]; // ("#photo-upload").get[0];
            formData.append('file', photoUpload);
            contentType = 'multipart/form-data';
        }
        return formData;
    }

    async function uploadPhoto(data) {
        const URL = "/photo/upload";
        let params = {
            method: 'POST',
            body: data
        };

        const result = await fetch(URL, params);
        if (!result.ok) {
            throw new Error("HTTP error " + result.status);
        }
        try {
            return await result.json();
        } catch { // Note: ES2019 allows optional `catch` bindings
            this.dataError = true;
        }
    }

    $(".btn-photo-upload").on("click", function(event) {
        // the statement below is so important.
        // if it is omitted, we probably see the request hit twice in the logic implementation
        event.preventDefault();
        console.log("you've clicked me!");
        const uploaded = extractData(event);
        uploadPhoto(uploaded).then(data => {
            if (data !== undefined) {
                console.log(data);
                toastr.success(data["message"] ? data["message"] : JSON.stringify(data));
            } else {
                toastr.error("No photo provided!");
            }
            // clear all the fields
            $('#upload-form')[0].reset();

            // check where the upload was requested: from list view or upload view. If it is the list view,
            // add a new photo placeholder to load the newly uploaded photo
        }).catch(error => {
            console.error('Error: ', error);
        }).finally(() => {
            console.log("Finished the photo upload");
            if (window.location.href.includes("/photo/list")) {
                window.location.reload();
            }
        });

        //toggleLockAndUnlockForm(true);
    });


    $(".photo-courtesy").on("focusout", function() {
        let value = $(this).val();
        if (value.includes("facebook.com")) {
            if (value.includes("idorvanity")) {
                // sample: https://www.facebook.com/photo/?fbid=939173604889879&set=
                // gm.2374139532977440&idorvanity=1316017315456339
                let sanitized = value.substring(0, value.lastIndexOf("idorvanity") - 1);
                $(this).val(sanitized);
            } else if (value.includes("&__cft__[0]=")) {
                // sample: https://www.facebook.com/photo/?fbid=421035673604303&set=a.308446338196571&__cft__[0]=
                // AZWZJnJc6XKMl4KSiT2DV0mDUbD2pqFEQXSpS70XQcUmfe0Tj6qz7QnbgVzkPtiLkSaqurQxT59UakbgtYoJSi6chjBLDPlLiRQZ
                // aMg6fzndlSWMBAV8RvLvdMbud9DntQH-Doy-Y3sQG2mbk0WD46ng9VVz9rBTdv1du9Kon6p4GMym_8zxy5NAkB5wsAOSjrqDHXP
                // OOvrm68LUjo7pzJYoPVWIJYIyLDsXMhnt-JP7kw&__tn__=EH-y-R
                let sanitized = value.substring(0, value.lastIndexOf("&__cft__[0]=") - 1);
                $(this).val(sanitized);
            }
        }
    });
</script>
