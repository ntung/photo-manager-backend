<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
    <style>
        .todo {
            padding: 20px;
            margin: 10px;
            background-color: #eee;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row"><div class="col">
    {% include '_menu-bar.html' %}
    <h1>Photo Manager</h1>
    <hr/>
    <div class="content">
    <form method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <b><label for="photo-upload" class="form-label">Upload photos/images/pictures/figures/videos/clips...</label></b>
            <input type="file" id="photo-upload" name="photo-upload" 
            class="form-control" accept="image/png,image/jpeg,image/jpg"/>
            <br/>
            <strong><label for="photo-url" class="form-label">Image/Photo URL</label></strong><br/>
            <input id="photo-url" name="photo-url" type="text" placeholder="Image/Photo URL" class="form-control"/>

        </div>

        <div class="mb-3">
            <strong><label for="photo-title" class="form-label">Title</label></strong><br/>
            <input id="photo-title" name="title" type="text" placeholder="Title of photo" class="form-control"/>
        </div>
        <div class="mb-3">
            <strong><label for="photo-description" class="form-label">Description</label></strong><br/>
            <textarea id="photo-description" name="description" type="textarea" placeholder="Provide a description" 
            class="form-control"></textarea>
        </div>
        <div class="mb-3">
            <strong><label for="photo-courtesy" class="form-label">Credit/Courtesy</label></strong><br/>
            <input id="photo-courtesy" name="courtesy" type="text" placeholder="Photo courtesy" class="form-control"/>
        </div>
        <div class="mb-3">
        <button type="submit" class="btn btn-primary">Upload</button>
        </div>
    </form>
    <hr>
    {% for photo in photos %}
        <div class="row">
            <p><strong>{{ photo['title'] }} ({{ photo['filename'] }})</strong></p>
        <div>
            <img id="{{ photo['folder'] }}-{{ photo['filename'] }}" src="{{ 'http://' + api_svr + ':5000/photo/' + photo['folder'] + '/' + photo['filename'] }}"
                 style="width:15%" alt="{{ photo['title'] }}"><br/>
        {{ photo['description']}}</div>
            <br/>
        <div id="action-buttons" class="row">
            <div class="col-2">
            <input type="button" value="Add to album" class="btn btn-primary" name="add-to-album"
                   data-image-folder="{{ photo['folder'] }}"
                   data-image-filename="{{ photo['filename'] }}"/></div>
            <div class="col-10">
            <select class="form-select form-select-sm" aria-label="Small select example"
                    multiple aria-label="Multiple select example">
                <option selected>Select an album</option>
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select></div>
        </div>
        </div>
    {% endfor %}

    </div></div></div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.slim.js"
    integrity="sha256-UgvvN8vBkgO0luPSUl2s8TIlOSYRoGFAX4jlCIm9Adc="
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
<script>
    $('input[name=add-to-album]').on("click", function() {
        console.log("implemented me!");
        const imageFolder = $(this).attr("data-image-folder");
        const imageFilename = $(this).attr("data-image-filename");
        console.log(imageFolder, imageFilename);
    });
</script>
</body>
</html>
