<!DOCTYPE html>
<html lang="en">
<head>
    <title>List & Upload | Photo Manager</title>
    {% include('_head.html') %}

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css"/>
    <style>
        .photo-block {
            border: 2px solid #9714d0;
            margin-bottom: 2px;
        }

        .photo-metadata {
            padding-top: 3px;
            margin-bottom: 0 !important;
        }
        .editing {
            outline: 2px solid #4a90e2;
            background: #eef6ff;
            border-radius: 4px;
            padding: 2px 4px;
        }
    </style>
</head>
<body>
<div class="container">
    {% include '_menu-bar.html' %}
    <div class="main">
    <div class="row">
        <div class="col">
            <h1>Photo Manager</h1>
            <div class="content">
                {% include('_photo-upload-form.html') %}
            </div>
        </div>
    </div>
    </div>
    <div id="photo-list">
    {% include('_photo-list.html') %}
    </div>

</div>
{% include('_albums-select2-modal-form.html') %}
{% include('_foot.html') %}
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="{{ url_for('static', filename='js/jquery.dm-uploader.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/fslightbox.js') }}"></script>
<script>
    $(document).ready(function () {
        toastr.options = {
            "closeButton": false,
            "debug": false,
            "newestOnTop": false,
            "progressBar": false,
            "positionClass": "toast-top-right",
            "preventDuplicates": false,
            "onclick": null,
            "showDuration": "300",
            "hideDuration": "1000",
            "timeOut": "5000",
            "extendedTimeOut": "1000",
            "showEasing": "swing",
            "hideEasing": "linear",
            "showMethod": "fadeIn",
            "hideMethod": "fadeOut"
        };
        $('#upload-form')[0].reset();
    });

    let photoObjectId = "", photoFolder = "", photoFileName = "", photoTitle = "";
    let currentPage = 1;
    let isLoading = false;
    let hasMore = true;

    $(window).on('scroll', function() {
        if (isLoading || !hasMore) return;

        if ($(window).scrollTop() + $(window).height() >= $(document).height() - 300) {
            loadMoreContent();
        }
    });

    function loadMoreContent() {
        isLoading = true;

        $.ajax({
            url: '/api/v1/photos',
            type: 'GET',
            data: { page: currentPage },
            success: function(response) {
                if (response.photos.length === 0) {
                    hasMore = false;
                    return;
                }

                $("#photo-list").append(response.content);
                refreshFsLightbox();
                // TODO: change the page=currentPage in the current URI without reloading the page
                currentPage++;
                isLoading = false;
            },
            error: function() {
                isLoading = false;
            }
        });
    }

    $(document).on("click", 'input[name=add-to-album]', function (event) {
        event.preventDefault();
        const $albumList = $('.album-list');
        if ($albumList.html() !== '') {
            $albumList.html("");
            return true;
        }
        photoObjectId = $(this).attr("data-photo-object-id");
        photoFolder = $(this).attr("data-photo-folder");
        photoFileName = $(this).attr("data-photo-filename");
        // const select2Data = $('#' + imageFilename).select2('data');

        $.ajax({
            url: "/albums/add-photo",
            method: "POST",
            contentType: "application/json; charset=utf-8",
            data: JSON.stringify({
                "photo-folder": photoFolder,
                "photo-filename": photoFileName,
                "view": "photo-list"
            }),
            dataType: "html",
            success: function (data) {
                $albumList.html("");
                const id_selector = photoFileName.substring(0, photoFileName.lastIndexOf("."));
                $('#' + id_selector).html(data);

                $('.choose-albums').select2({
                    theme: 'bootstrap-5',
                    width: $(this).data('width') ? $(this).data('width') : $(this).hasClass('w-100') ? '100%' : 'style',
                    placeholder: $(this).data('placeholder'),
                    closeOnSelect: false,
                    allowClear: true,
                });
            }
        });
    });

    $(document).on("click", ".select-albums-modal-form", function(event) {
        event.preventDefault();
        photoObjectId = $(this).attr("data-photo-object-id");
        photoFolder = $(this).attr("data-photo-folder");
        photoFileName = $(this).attr("data-photo-filename");
    });

    $(document).on("click", ".btn-edit-photo", function (event) {
        event.preventDefault();
        const photoObjectId = $(this).attr("data-photo-object-id");
        const photoTitle = $('#photo-title-' + photoObjectId)[0].innerText;
        $("#photo-title").val(photoTitle);
        // Change Create to Save button
        $("#action-button").html('<button type="button" class="btn btn-primary" id="btn-save">Save</button>');
        const photoDescription = $('#photo-description-' + photoObjectId)[0].innerHTML;
        $("#photo-description").val(photoDescription);
        //console.log(photoDescription);
        const photoCourtesy = $('#original-photo-courtesy-' + photoObjectId)[0].innerHTML;
        $("#photo-courtesy").val(photoCourtesy);
        //console.log(photoCourtesy);
        window.scrollTo(0, 0);
        $("#photo-edit-modal-form").modal("show");
        $("#btn-save").on("click", function () {
            console.log("saving...");

            $.ajax({
                url: "/photo/update",
                method: "POST",
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                data: JSON.stringify({
                    "photo-object-id": photoObjectId,
                    "photo-title": $("#photo-title").val(),
                    "photo-description": $("#photo-description").val(),
                    "photo-courtesy": $("#photo-courtesy").val()
                }),
                beforeSend: function () {
                    console.log("Sending data to server...");
                },
                success: function () {
                    toastr.success("Updated successfully! The page is refreshing within one second.");
                    $('#upload-form')[0].reset();
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                    // alternatively, reload the album using jQuery without refreshing the page
                },
                error: function () {

                }
            }).done(function (data) {
                console.log("Done! - Data: ", data);
            }).fail(function (jqXHR, textStatus) {
                console.log(textStatus, ": ", JSON.stringify(jqXHR));
            }).always(function (data) {
                console.log("The request has completed: ", data);
                toastr.success("The request has completed : " + JSON.stringify(data));
            });
        });
    });

    $(document).on("click", ".btn-delete-photo", function (event) {
        event.preventDefault();
        const photoObjectId = $(this).attr("data-photo-object-id");
        const photoFolder = $(this).attr("data-photo-folder");
        const photoFileName = $(this).attr("data-photo-filename");

        $.ajax({
            url: "/photo/delete",
            method: "POST",
            contentType: "application/json; charset=utf-8",
            dataType: "json",
            data: JSON.stringify({
                "photo-object-id": photoObjectId,
                "photo-folder": photoFolder,
                "photo-filename": photoFileName,
            }),
            beforeSend: function () {
                console.log("Sending data to server...");
            },
            success: function () {
                toastr.success("Deleted successfully! The page is refreshing within one second.");
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
                // alternatively, reload the album using jQuery without refreshing the page
            },
            error: function () {

            }
        }).done(function (data) {
            console.log("Done! - Data: ", data);
        }).fail(function (jqXHR, textStatus) {
            console.log(textStatus, ": ", JSON.stringify(jqXHR));
        }).always(function (data) {
            console.log("The request has completed: ", data);
            toastr.success("The request has completed : " + JSON.stringify(data));
        });
    });

    $(document).on("click", "#btn-save", function (event) {
        event.preventDefault();
        // retrieves the existing albums which the photo in question has been added
        const inAlbumsSelector = $('#in-albums-' + photoObjectId)[0];
        let existingAlbums = [];
        $.map(inAlbumsSelector.children, (child) => {
            existingAlbums.push(child.innerHTML);
        });

        const select2Data = $('.select2-selection__choice');
        let albums = [];
        $.each(select2Data, (index, object) => {
            const albumTitle = object.innerText;
            const lastChildId = object.lastChild.id;
            // the id of the lastChild looks like the sample below. It is patterned like
            // "select2-{filename}-container-choice-xxxx-{album-path}"
            // id="select2-759b75a8-3bbb-4750-b5a7-b9f80d16c184jpg-container-choice-5ua6-positive-thinking-quotes"
            const startPos = lastChildId.lastIndexOf("container-choice");
            const albumPath = lastChildId.substring(startPos + "container-choice-".length + 5);
            albums.push({"path": albumPath, "title": albumTitle, "photo_object_id": photoObjectId});
        });
        $.ajax({
            url: "/photo/save-photo-to-albums/",
            method: "POST",
            contentType: "application/json; charset=utf-8",
            dataType: "json",
            data: JSON.stringify({
                "photo-object-id": photoObjectId,
                "photo-folder": photoFolder,
                "photo-filename": photoFileName,
                "newly-added-albums": albums
            }),
            beforeSend: function () {
                console.log("Sending data to server...");
                let alreadyAddedAlbums = [];
                $.map(albums, function (item) {
                    const title = item.title;
                    if (existingAlbums.includes(title)) {
                        alreadyAddedAlbums.push(title);
                    }
                });
                if (alreadyAddedAlbums.length > 0) {
                    const s = alreadyAddedAlbums.join(", ");
                    toastr.warning("The photo is available in these albums " + s + ". Please remove them before clicking Save.");
                    return false;
                }
            },
            success: function (data) {
                console.log("Data returned back: ", data);
                const inAlbumsSelector = $('#in-albums-' + data['photo-object-id'])[0];
                let innerHTML = inAlbumsSelector.innerHTML;
                data['updated-albums'].map(item => {
                    if (!existingAlbums.includes(item.title)) {
                        innerHTML += '<a href="/albums/view/' + item.path + '">' + item.title + '</a>, ';
                    } else {
                        console.log("Photo " + photoFileName + " already added to the album " + item.title);
                        toastr.warning("Photo " + photoFileName + " already added to the album " + item.title);
                    }
                });
                inAlbumsSelector.innerHTML = innerHTML;
                $('.album-list').html("");
            },
            error: function () {

            }
        })
        .done(function (data) {
            console.log("Done! - Data: ", data);
            toastr.success("Added the photo to the selected albums successfully!");
        })
        .fail(function (jqXHR, textStatus) {
            console.log(textStatus, ": ", JSON.stringify(jqXHR));
        })
        .always(function (data) {
            console.log("The request has completed: ", data);
            toastr.success("The request has completed!");
        });
    });

    $(document).on("click", ".photo-title", function (event) {
        event.preventDefault();
        if ($(this).length === 0) { return; }
        const firstChild = $(this)[0];
        photoTitle = firstChild.innerText;
        console.log(photoTitle);
        // ex: A sample of the id: photo-title--6945e21d8f15586b7f0aa018
        const length = -(firstChild.id.length - "photo-title".length - 1);
        const pObjId = firstChild.id.slice(length);
        console.log(pObjId);
        $(this).attr("contenteditable", "true") .addClass("editing") .focus();
    });

    $(document).on("blur", ".photo-title", function (event) {
        event.preventDefault();
        if ($(this).length === 0) { return; }
        const $el = $(this);
        const newValue = $el.text().trim();
        if (newValue === photoTitle) {
            $el.attr("contenteditable", "false").removeClass("editing");
            return;
        }
        const id = $el[0].id; // e.g. Photo ID
        const photoId = id.slice(-(id.length - "photo-title".length - 1));
        $el.attr("contenteditable", "false").removeClass("editing");

        $.ajax({
            url: `/api/v1/photo/update`,
            method: "PATCH",
            contentType: "application/json",
            data: JSON.stringify({ "photo-id": photoId, "new-photo-title": newValue }),
            success(res) {
                console.log("Testing " + JSON.stringify(res));
            },
            error(xhr) {
                console.log(xhr.responseJSON.error);
                toastr.error(xhr.responseJSON.error);
                // Get back the previous value
                $el[0].innerText = photoTitle;
            }
        });
    });

</script>
</body>
</html>
