<!-- use jquery-ui sortable -->
<style>
    #photo-gallery {
        margin: 0;
        padding: 0;
        list-style-type: none;
    }

    #photo-gallery div {
        margin: 0 4px 4px 4px;
        padding: 0.4em;
        display: inline-block;
    }

    .photo-item {
        border: 1px solid #fff;
        width: 200px;
    }

    .selection-checkbox {
        opacity: 0;
    }

    .selection-checkbox:hover,
    .selection-checkbox:checked {
        opacity: 1;
    }
</style>
<div id="photo-gallery" class="my-gallery">
    {% for photo in photos %}
        <div class="photo-item">
            {% set photo_url = '/photo/' + photo['folder'] + '/' + photo['filename'] %}
            <span class="align-items-center">
            <label>
            <input type="checkbox" class="form-check-input selection-checkbox"
                   data-photo-object-id="{{ photo.get('_id') }}"/>
            </label></span>
            <a href="{{ photo_url }}" title="{{ photo['title'] }}" data-lightbox="{{ album_path }}">
                <img src="{{ photo_url }}" alt="{{ photo['title'] }}" class="img-item"
                     data-photo-object-id="{{ photo.get('_id') }}" style="width: 50%"></a>

        </div>
    {% endfor %}
</div>


<script>
    const selectedPhotoSet = new Set();
    $(function () {
        $("#photo-gallery").sortable({
            update: (event, ui) => {
                saveUpdateAlbum();
            }
        });
    });

    function saveUpdateAlbum() {
        const values = [];
        $('.img-item').each(function (index) {
            values.push($(this).attr("data-photo-object-id"));
        });
        const body = {
            "album-object-id": "{{album_object_id}}",
            "photos": values
        }

        updateOrder(body);
    }

    $('.selection-checkbox').on("click", function() {
        const photoObjectId = $(this).attr("data-photo-object-id");
        if ($(this).is(':checked')) {
            //console.log("checked");
            selectedPhotoSet.add(photoObjectId);
        } else {
            //console.log("unchecked");
            selectedPhotoSet.delete(photoObjectId);
        }
    });
</script>
