<div class="row">
    <div class="col-5">
        <button type="button" class="btn btn-primary" id="btn-reset-order-photo">Reset Order</button>
        <button type="button" class="btn btn-primary" id="btn-shuffle-photo"
                data-album-object-id="{{ album_object_id }}"
                data-album-path="{{ album_path }}">Shuffle <i class="fa fa-random" style="font-size:20px"></i>
        </button>
        <span><i id="btn-view-changer" class="fa fa-th-list" style="font-size:26px"></i></span>
    </div>
    <div class="col-5">
        <!-- Example split danger button -->
        <div class="btn-group" style="display: block">
            <div class="row">
                <div class="col-2">
                    <p style="font-size: 26px" id="sort-direction-block" class="sort-direction-para">
                        <i class="fa fa-arrow-circle-down" aria-hidden="true" id="sort-direction-icon"></i>
                    </p>
                </div>

                <div class="col-10">
                    <button type="button" class="btn btn-danger" id="btn-sort">Sort</button>
                    <button type="button" class="btn btn-danger dropdown-toggle dropdown-toggle-split"
                            data-bs-toggle="dropdown" aria-expanded="false">
                        <span class="visually-hidden">Toggle Dropdown</span>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" data-field-name="title">Title</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" data-field-name="date_modified">Modified</a></li>
                        <li><a class="dropdown-item" data-field-name="date_uploaded">Uploaded</a></li>
                    </ul>
                </div>

            </div>
        </div>
    </div>
    <div class="col-2">
        <button type="button" class="btn btn-primary" id="btn-remove-photo"
                data-album-path="{{ album_path }}"
                data-album-title="{{ album_title }}">Remove
        </button>
    </div>
</div>
