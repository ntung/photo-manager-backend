<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Albums | Photo Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
    <style>
        .todo {
            padding: 20px;
            margin: 10px;
            background-color: #eee;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row"><div class="col">
        {% include '_menu-bar.html' %}
        <h1>Albums | Photo Manager</h1>
    <hr/>
    <div class="content">
    <form method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <strong><label for="cover" class="form-label">Upload a photo for Album cover</label></strong>
            <input type="file" id="cover" name="cover"
            class="form-control" accept="image/png,image/jpeg,image/jpg"/>
        </div>

        <div class="mb-3">
            <strong><label for="title" class="form-label">Title</label></strong><br/>
            <input id="title" name="title" type="text" placeholder="Album Title" class="form-control"/>
        </div>
        <div class="mb-3">
            <strong><label for="description" class="form-label">Description</label></strong><br/>
            <textarea id="description" name="description" type="textarea" placeholder="Describe your album"
            class="form-control"></textarea>
        </div>

        <div class="mb-3">
        <button type="submit" class="btn btn-primary">Create</button>
        </div>
    </form>
    <hr>
    {% for album in albums %}
        <div class="album">
            <p><a href="http://{{ api_svr }}:5000/albums/view/{{ album['path'] }}">{{ album['title'] }}</a><br/>
                <em>{{ album['description']}}</em></p>
        </div>
    {% endfor %}

    </div></div></div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
        crossorigin="anonymous"></script>
</body>
</html>
