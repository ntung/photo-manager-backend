<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Albums | Photo Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .todo {
            padding: 20px;
            margin: 10px;
            background-color: #eee;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row"><div class="col">
        {% include '_menu-bar.html' %}
        <h1 id="heading">Albums | Photo Manager</h1>
    <hr/>
    <div class="content">
    <form method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <strong><label for="cover" class="form-label">Upload a photo for Album cover</label></strong>
            <input type="file" id="cover" name="cover"
            class="form-control" accept="image/png,image/jpeg,image/jpg"/>
        </div>

        <div class="mb-3">
            <strong><label for="title" class="form-label">Title</label></strong><br/>
            <input id="title" name="title" type="text" placeholder="Album Title" class="form-control"/>
        </div>
        <div class="mb-3">
            <strong><label for="description" class="form-label">Description</label></strong><br/>
            <textarea id="description" name="description" type="textarea" placeholder="Describe your album"
            class="form-control"></textarea>
        </div>

        <div class="mb-3 action-button" id="action-button">
        <button type="submit" class="btn btn-primary">Create</button>
        </div>
    </form></div></div></div>

    <div class="album">
    <div class="row">
        <div class="col-8"><strong>Albums</strong></div>
        <div class="col-4"><strong>Actions</strong></div>
    </div>
    {% for album in albums %}
    <div class="row">
        <div class="col-8">
            <p id="album-{{ album['path'] }}" style="margin-bottom: 0 !important;">
                <a href="http://{{ api_svr }}:5000/albums/view/{{ album['path'] }}"
                    class="album-title" data-album-path="{{ album['path'] }}"
                    id="link-album-title-{{ album['path'] }}">{{ album['title'] }}</a></p>
            <p class="album-description" id="album-description-{{album['path']}}"
               style="font-style: italic">{{album['description']}}</p>
        </div>
        <div class="col-4 align-content-center align-self-center">
            <a id="btn-edit-{{album['path']}}" class="btn-edit-album"
                    data-album-path="{{album['path']}}"
                    data-album-title="{{album['title']}}">
                <i id="edit-{{ album['path'] }}" class="fa fa-pencil-square-o" style="font-size:24px"></i></a>
            <a id="btn-delete-{{album['path']}}" class="btn-delete-album"
                    data-album-object-id="{{album.get('_id')}}"
                    data-album-path="{{album['path']}}"
                    data-album-title="{{album['title']}}">
                <i id="delete-{{ album['path'] }}"  class='fa fa-trash-o' style='font-size:24px'></i></a>

        </div>


    </div>
    {% endfor %}
    </div>
</div>
<script
        src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script>
    let albumPath = "", albumTitle = "";

    $('.btn-edit-album').on("click", function() {
        albumPath = $(this).attr("data-album-path");
        albumTitle = $(this).attr("data-album-title");
        $("#title").val(albumTitle);
        let albumDescription = $('#album-description-'+albumPath)[0].innerText;
        console.log(albumDescription);
        $("#description").val(albumDescription);
        // Change Create to Save button
        $("#action-button").html('<button type="button" class="btn btn-primary" id="btn-save">Save</button>');
        $("#btn-save").on("click", function() {
            console.log("saving...");
            albumTitle = $('#title').val();
            albumDescription = $('#description').val();

            $.ajax({
                url: "http://192.168.0.10:5000/albums/update",
                method: "POST",
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                data: JSON.stringify({
                    "album-path": albumPath,
                    "album-title": albumTitle,
                    "album-description": albumDescription
                }),
                beforeSend: function(xhr) {
                    console.log("Sending data to server...");
                },
                success: function(data) {
                    toastr.success("Updated successfully! The page is refreshing within 5 seconds.");
                    setTimeout(() => {
                        window.location.reload();
                    }, 5000);
                    // alternatively, reload the album using jQuery without refreshing the page
                },
                error: function() {

                }
            }).done(function(data) {
                console.log("Done! - Data: ", data);
            }).fail(function(jqXHR, textStatus) {
                console.log(textStatus, ": ", JSON.stringify(jqXHR));
            }).always(function(data) {
                console.log("The request has completed: ", data);
                toastr.success("The request has completed : " + JSON.stringify(data));
            });
        });
    });

    $('.btn-delete-album').on("click", function() {
        albumPath = $(this).attr("data-album-path");
        albumTitle = $(this).attr("data-album-title");
        const albumObjectId = $(this).attr("data-album-object-id");
        $.ajax({
            url: "http://192.168.0.10:5000/albums/delete",
            method: "POST",
            contentType: "application/json; charset=utf-8",
            dataType: "json",
            data: JSON.stringify({
                "album-object-id": albumObjectId,
                "album-path": albumPath,
                "album-title": albumTitle
            }),
            beforeSend: function(xhr) {
                console.log("Sending data to server...");
            },
            success: function(data) {
                toastr.success("Updated successfully! The page is refreshing within 3 seconds.");
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
                // alternatively, reload the album using jQuery without refreshing the page
            },
            error: function() {

            }
        }).done(function(data) {
            console.log("Done! - Data: ", data);
        }).fail(function(jqXHR, textStatus) {
            console.log(textStatus, ": ", JSON.stringify(jqXHR));
        }).always(function(data) {
            console.log("The request has completed: ", data);
            toastr.success("The request has completed : " + JSON.stringify(data));
        });
    });
</script>
</body>
</html>
