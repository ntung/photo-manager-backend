<!DOCTYPE html>
<html lang="en">
<head>
    <title>Gallery | Photo Manager</title>
    {% include('_head.html') %}
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css"/>
    <style>
        #photo-gallery {
            column-count: 2;
            column-gap: 4px;
        }

        .gallery-item {
            display: block;
            break-inside: avoid;
            margin-bottom: 4px;
        }

        .gallery-item-actions {
            padding: 4px 2px 6px;
        }

        .gallery-in-albums {
            font-style: italic;
            color: #9714d0;
            margin: 0 0 4px;
            font-size: 0.85em;
        }

        .w3s-btn {
            border: none;
            outline: none;
            padding: 10px 16px;
            background-color: #f1f1f1;
            cursor: pointer;
            font-size: 18px;
        }

        .w3s-btn:hover {
            background-color: #ddd;
        }

        .w3s-btn.active {
            background-color: #666;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    {% include '_menu-bar.html' %}
    <div class="main">
    <div class="row">
        <div class="col">
            <h1>Photo View</h1>
        </div>
    </div>

    <div id="myHeader" style="margin-bottom: 8px;">
        <p>Click on the buttons to change the grid view.</p>
        <button class="w3s-btn" onclick="setColumns(1, this)">1</button>
        <button class="w3s-btn active" onclick="setColumns(2, this)">2</button>
        <button class="w3s-btn" onclick="setColumns(4, this)">4</button>
    </div>

    <div id="photo-gallery">
        {% include('_photo-view-items.html') %}
    </div>
    </div>
</div>
{% include('_albums-select2-modal-form.html') %}
{% include('_foot.html') %}
<script src="{{ url_for('static', filename='js/fslightbox.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    let photoObjectId = "", photoFolder = "", photoFileName = "";
    let galleryCurrentPage = 2;
    let galleryIsLoading = false;
    let galleryHasMore = {{ 'true' if has_more else 'false' }};

    $(window).on('scroll', function () {
        if (galleryIsLoading || !galleryHasMore) return;
        if ($(window).scrollTop() + $(window).height() >= $(document).height() - 300) {
            loadMoreGalleryPhotos();
        }
    });

    function loadMoreGalleryPhotos() {
        galleryIsLoading = true;
        $.ajax({
            url: '/api/v1/photos/gallery',
            type: 'GET',
            data: { page: galleryCurrentPage },
            success: function (response) {
                galleryIsLoading = false;
                if (response.count === 0) {
                    galleryHasMore = false;
                    return;
                }
                $('#photo-gallery').append(response.content);
                galleryCurrentPage += 1;
                galleryHasMore = response.has_more;
                refreshFsLightbox();
            },
            error: function () {
                galleryIsLoading = false;
            }
        });
    }

    $(document).on("click", ".select-albums-modal-form", function (event) {
        event.preventDefault();
        photoObjectId = $(this).attr("data-photo-object-id");
        photoFolder = $(this).attr("data-photo-folder");
        photoFileName = $(this).attr("data-photo-filename");
    });

    function setColumns(n, btn) {
        document.getElementById('photo-gallery').style.columnCount = n;
        document.querySelectorAll('.w3s-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
</script>
</body>
</html>
